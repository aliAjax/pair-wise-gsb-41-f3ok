<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>巨灾理赔调度</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1200px;margin:28px auto;padding:0 20px;color:#263746}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d3dce3;padding:7px}th{background:#f1f5f7}.card{background:#fff8eb;border-left:5px solid #d58b21;padding:12px 16px}code{background:#eef2f4;padding:2px 5px}button{cursor:pointer}.num{text-align:right;font-variant-numeric:tabular-nums}.pending{color:#b26a00}.received{color:#1a7f37}</style>
<h1>巨灾保险理赔调度</h1><div class="card">状态页按调用角色过滤。写入接口需要 <code>X-User</code>、<code>X-Role</code>，详见 README。</div>
<p><label>用户 <input id="user"></label> <label>角色 <select id="role"><option>supervisor</option><option>auditor</option><option>intake</option><option>adjuster</option><option>surveyor</option></select></label> <button id="reload">刷新</button></p>
<h2>赔后回收台账</h2><table id="ledger"><thead><tr><th>报案号</th><th>状态</th><th>赔款</th><th>待回收</th><th>已回收</th><th>净支出</th><th>回收明细 / 操作</th></tr></thead><tbody></tbody></table>
<h3>登记回收（主管）</h3>
<form id="reg">案件ID <input name="claim_id" type="number" min="1" required> 处置方式 <select name="method"><option value="salvage">残值处置</option><option value="subrogation">第三方追偿</option><option value="other">其他</option></select> 预计回收 <input name="expected_amount" type="number" min="0.01" step="0.01" required> 收款凭证 <input name="voucher" required> 备注 <input name="note"> <button>登记</button></form>
<h2>优先队列</h2><table id="claims"><thead><tr><th>报案号</th><th>区域</th><th>状态</th><th>优先级</th><th>欺诈分</th><th>负责人</th></tr></thead><tbody></tbody></table>
<h2>最近时间线</h2><ol id="timeline"></ol>
<script>
const METHOD={salvage:'残值处置',subrogation:'第三方追偿',other:'其他'};
const fmt=n=>Number(n||0).toFixed(2);
const $=id=>document.getElementById(id);
$('user').value=localStorage.getItem('user')||'sup1';
$('role').value=localStorage.getItem('role')||'supervisor';
function hdrs(){localStorage.setItem('user',$('user').value);localStorage.setItem('role',$('role').value);return{'Content-Type':'application/json','X-User':$('user').value,'X-Role':$('role').value}}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:hdrs(),body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||('请求失败 '+r.status));throw new Error(d.error||r.status)}return d}
async function load(){
  const h=hdrs();
  const d=await fetch('/api/state',{headers:h}).then(r=>r.json());
  document.querySelector('#claims tbody').innerHTML=d.claims.map(r=>`<tr><td>${r.claim_no}</td><td>${r.region}</td><td>${r.status}</td><td>${r.priority_score.toFixed(1)}</td><td>${r.fraud_score}</td><td>${r.assignee||''}</td></tr>`).join('');
  document.querySelector('#timeline').innerHTML=d.timeline.slice(0,20).map(x=>`<li>${x.created_at} ${x.action} ${x.details}</li>`).join('');
  const lr=await fetch('/api/recoveries',{headers:h});
  const L=lr.ok?await lr.json():{ledger:[]};
  document.querySelector('#ledger tbody').innerHTML=L.ledger.map(c=>{
    const rows=c.entries.map(e=>`<tr><td>${METHOD[e.method]||e.method}</td><td class="num">${fmt(e.expected_amount)}</td><td class="num">${e.status==='received'?fmt(e.received_amount):'—'}</td><td>${e.voucher}</td><td class="${e.status}">${e.status==='received'?'已回收':'待处理'}</td><td>${e.status==='pending'?`<button onclick="receive(${e.id})">确认到账</button>`:(e.received_at||'')}</td></tr>`).join('');
    const detail=rows?`<table><thead><tr><th>处置方式</th><th>预计回收</th><th>实际到账</th><th>收款凭证</th><th>状态</th><th>操作 / 到账时间</th></tr></thead><tbody>${rows}</tbody></table>`:'';
    const reopen=['approved','rejected','closed'].includes(c.status)?` <button onclick="reopen(${c.claim_id},${c.version})">重开</button>`:'';
    return `<tr><td>${c.claim_no} (#${c.claim_id})</td><td>${c.status}${reopen}</td><td class="num">${fmt(c.payout)}</td><td class="num">${fmt(c.pending)}</td><td class="num">${fmt(c.received)}</td><td class="num">${fmt(c.net)}</td><td>${detail}</td></tr>`;
  }).join('');
}
async function receive(id){const a=prompt('实际到账金额');if(a===null||a==='')return;await api('/api/recoveries/receive',{recovery_id:id,received_amount:parseFloat(a)});load()}
async function reopen(id,ver){const reason=prompt('重开理由');if(!reason)return;await api('/api/claims/reopen',{claim_id:id,expected_version:ver,reason});load()}
$('reg').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/api/recoveries',{claim_id:+f.get('claim_id'),method:f.get('method'),expected_amount:parseFloat(f.get('expected_amount')),voucher:f.get('voucher'),note:f.get('note')||''});e.target.reset();load()};
$('reload').onclick=load;
load()
</script></html>
